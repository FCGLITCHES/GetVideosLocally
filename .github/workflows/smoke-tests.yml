name: Smoke Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run daily at 2 AM UTC to catch breakages early
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  smoke-tests:
    needs: quality-checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned tools
        # Downloads yt-dlp, FFmpeg, ffprobe and Node from tools-manifest.json
        # and verifies each sha256 before it lands in bin/.
        run: npm run tools:fetch

      - name: Tool and extractor smoke tests
        # Using permissioned test URLs that you control
        # These should be your own uploads that won't be removed
        run: node scripts/smoke-test.js
        env:
          TEST_YOUTUBE_URL: ${{ secrets.TEST_YOUTUBE_URL }}
          TEST_TIKTOK_URL: ${{ secrets.TEST_TIKTOK_URL }}

      - name: Check server starts
        env:
          PORT: '9875'
          USER_DATA_PATH: ${{ runner.temp }}\gvl-data
        run: |
          $server = Start-Process node -ArgumentList "server.js" -NoNewWindow -PassThru
          try {
            $page = $null
            for ($i = 0; $i -lt 30 -and -not $page; $i++) {
              try { $page = Invoke-WebRequest -Uri "http://127.0.0.1:$env:PORT/" -TimeoutSec 5 -UseBasicParsing } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $page) { throw "Server did not answer on port $env:PORT" }
            Write-Host "Server started - Status: $($page.StatusCode)"

            # The API must refuse requests without the app's session token.
            $status = try { (Invoke-WebRequest -Uri "http://127.0.0.1:$env:PORT/tools-status" -UseBasicParsing).StatusCode } catch { [int]$_.Exception.Response.StatusCode }
            if ($status -ne 401) { throw "Expected 401 from an unauthenticated API call, got $status" }
            Write-Host "Unauthenticated API call refused - Status: $status"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  package:
    needs: quality-checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned tools
        run: npm run tools:fetch

      - name: Package the app
        # Unpacked build only: no installer and no signing.
        run: npx electron-builder --win --x64 --dir -c electron-builder.json

      - name: Launch the packaged app
        run: node scripts/ci-launch-check.js dist/win-unpacked/GetVideosLocally.exe
